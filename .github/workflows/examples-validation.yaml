name: Examples

# The existing `CI` workflow lints core/ only, so nothing in the repository has
# ever checked examples/. This workflow closes that gap. It is deliberately fast
# and dependency-free: no datasets, no model weights, no GPU. Every check here
# runs on a cold runner in well under a minute.

on:
  push:
    branches:
      - main
    tags:
  pull_request:
    paths-ignore:
      - '**.md'

jobs:
  config-validation:
    name: validate example configs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: python -m pip install pyyaml

      # Fails only on findings absent from .ci/examples-baseline.json, so the
      # pre-existing backlog does not block unrelated work while it is being
      # worked down. Deleting a line from the baseline is how a fix gets locked in.
      - name: Validate
        run: |
          python scripts/validate_examples.py \
            --baseline .ci/examples-baseline.json

      - name: Explain failure
        if: failure()
        run: |
          echo "::error::This PR introduces a new example-config problem."
          echo ""
          echo "Reproduce locally:"
          echo "    python scripts/validate_examples.py --baseline .ci/examples-baseline.json"
          echo ""
          echo "Most path breakage is repaired automatically:"
          echo "    python scripts/validate_examples.py --fix"

  dependency-manifests:
    name: check requirements files
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # `pip install --dry-run` resolves the full dependency graph without
      # downloading wheels, so a typo like `dashscope=1.24.5` (single `=`, which
      # pip reads as a package literally named "dashscope=1.24.5") or a package
      # that does not exist on PyPI fails here in seconds rather than in a
      # contributor's terminal thirty minutes into a setup guide.
      - name: Resolve every requirements file
        run: |
          status=0
          while IFS= read -r req; do
            echo "::group::$req"
            if ! python -m pip install --dry-run --quiet --report /dev/null -r "$req"; then
              echo "::error file=$req::could not be resolved by pip"
              status=1
            fi
            echo "::endgroup::"
          done < <(find examples -name 'requirement*.txt' -not -path '*/node_modules/*')
          exit $status

  pylint:
    name: pylint core (py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.7 and 3.8 reached end of life in 2023 and 2024; 3.9 in October 2025.
        # Keeping 3.9 for one release protects existing users while 3.10-3.12
        # cover what contributors actually have installed today.
        python-version: [ "3.9", "3.10", "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install libgl1-mesa-glx -y
          python -m pip install --upgrade pip
          python -m pip install pylint
          python -m pip install ${{ github.workspace }}/resources/third_party/*
          python -m pip install -r ${{ github.workspace }}/requirements.txt
      - name: Analysing code of core with pylint
        run: pylint --max-positional-arguments=10 '${{ github.workspace }}/core'
