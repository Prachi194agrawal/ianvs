testenv:
  # dataset configuration
  dataset:
    # the url address of train dataset index; string type;
    #
    # WAS: train_url: "/home/aryan/ianvs/dataset/train-index.txt"
    # Two defects in one line.
    #   * `train_url` is not a configuration field. Dataset.process_dataset()
    #     derives it from train_index/train_data/train_data_info. Setting it here
    #     is accepted silently and then raises NotImplementedError mid-run.
    #   * The value was an absolute path into a contributor's home directory, so
    #     it could never resolve for anyone else.
    train_index: "./dataset/Cloud-Robotics/train-index.txt"
    # the url address of test dataset index; string type;
    test_index: "./dataset/Cloud-Robotics/test-index.txt"

  # model eval configuration of incremental learning;
  model_eval:
    # metric used for model evaluation
    model_metric:
      # metric name; string type;
      name: "accuracy"
      # the url address of python file
      #
      # WAS: ./examples/cloud-robotics/single_task_learing/testenv/accuracy.py
      # Wrong directory name and a typo ("learing"). The same file is referenced
      # three different ways in this one example; none of the three existed.
      url: "./examples/Cloud_Robotics/singletask_learning_bench/Semantic_Segmentation/testenv/accuracy.py"
      mode: "no-inference"

    # condition of triggering inference model to update
    # threshold of the condition; types are float/int
    threshold: 0
    # operator of the condition; string type;
    # values are ">=", ">", "<=", "<" and "=";
    operator: "<"

  # metrics configuration for test case's evaluation; list type;
  metrics:
      # metric name; string type;
    - name: "accuracy"
      # the url address of python file
      #
      # WAS: ./examples/cloud_robotics/sinlge_task_learning/testenv/accuracy.py
      # Third spelling of the same path, with a second typo ("sinlge").
      url: "./examples/Cloud_Robotics/singletask_learning_bench/Semantic_Segmentation/testenv/accuracy.py"
    - name: "samples_transfer_ratio"

  # incremental rounds setting; int type; default value is 2;
  incremental_rounds: 5
