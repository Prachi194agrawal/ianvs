benchmarkingjob:
  # job name of bechmarking; string type;
  name: "benchmarkingjob"
  # the url address of job workspace that will reserve the output of tests; string type;
  #
  # WAS: "/ianvs/single_task_learning/cloud"
  # An absolute path outside the project. On a normal user account this fails
  # with PermissionError at the point results are written -- i.e. after the run.
  workspace: "./workspace/cloud_robotics_semantic_segmentation"

  # the url address of test environment configuration file; string type;
  # the file format supports yaml/yml;
  #
  # WAS: "./examples/cloud_robot/single_task_learning/testenv/testenv.yaml"
  testenv: "./examples/Cloud_Robotics/singletask_learning_bench/Semantic_Segmentation/testenv/testenv.yaml"

  # the configuration of test object
  test_object:
    # test type; string type;
    # currently the option of value is "algorithms",the others will be added in succession.
    type: "algorithms"
    # test algorithm configuration files; list type;
    algorithms:
      # algorithm name; string type;
      - name: "rfnet_singletask_learning"
        # the url address of test algorithm configuration file; string type;
        # the file format supports yaml/yml
        #
        # WAS: "./examples/cloud-robotics/single_task_learning/testalgorithm/rfnet/algorithm.yaml"
        url: "./examples/Cloud_Robotics/singletask_learning_bench/Semantic_Segmentation/testalgorithms/algorithm.yaml"

  # the configuration of ranking leaderboard
  #
  # This whole section was previously indented *inside* test_object, and `sort_by`
  # was absent altogether. BenchmarkingJob leaves self.rank as None when no `rank`
  # key is found at this level, then calls self.rank.save(...) in run(). The result
  # is an AttributeError on the very last statement of the job, after every epoch
  # of training has already been spent.
  rank:
    # rank leaderboard with metric of test case's evaluation and order ; list type;
    # the sorting priority is based on the sequence of metrics in the list from front to back;
    sort_by: [ { "accuracy": "descend" } ]

    # visualization configuration
    visualization:
      # mode of visualization in the leaderboard; string type;
      mode: "selected_only"
      # method of visualization for selected dataitems; string type;
      #  1> "print_table": print selected dataitems;
      method: "print_table"

    # selected dataitem configuration
    selected_dataitem:
      #   1> "all": select all paradigms in the leaderboard;
      #   2> paradigms in the leaderboard, e.g., "singletasklearning"
      paradigms: [ "all" ]
      #   1> "all": select all modules in the leaderboard;
      #   2> modules in the leaderboard, e.g., "basemodel"
      modules: [ "all" ]
      #   1> "all": select all hyperparameters in the leaderboard;
      #   2> hyperparameters in the leaderboard, e.g., "momentum"
      hyperparameters: [ "all" ]
      #   1> "all": select all metrics in the leaderboard;
      #   2> metrics in the leaderboard, e.g., "F1_SCORE"
      #
      # WAS: [ "accuracy", "task_avg_acc", "BWT", "FWT" ]
      # task_avg_acc, BWT and FWT are lifelong-learning metrics carried over by
      # copy-paste; this is a singletasklearning paradigm and never produces them.
      # samples_transfer_ratio, which testenv.yaml does define, was missing.
      metrics: [ "accuracy", "samples_transfer_ratio" ]

    # model of save selected and all dataitems in workspace `./rank` ; string type;
    #  1> "selected_and_all": save selected and all dataitems;
    #  2> "selected_only": save selected dataitems;
    save_mode: "selected_and_all"
